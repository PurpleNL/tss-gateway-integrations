site_name: TSS Gateway
site_description: Integrate with TSS players through the gateway.
site_url: https://purplenl.github.io/tss-gateway-integrations/
repo_url: https://github.com/PurpleNL/tss-gateway-integrations
repo_name: tss-gateway-integrations

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - admonition

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Best practices: best-practices.md
  - Postman collection: postman.md
  - Protocol:
      - Routing: routing.md
      - Authentication: authentication.md
      - Requests: requests.md
      - Events: events.md
      - Queries: queries.md
      - models.proto: protos/models.proto.md
      - events.proto: protos/events.proto.md
      - requests.proto: protos/requests.proto.md
  - C# SDK: csharp/getting-started.md
  - Feature requests: feature-requests.md
  - Changelog: changelog.md
