name: Regenerate Postman Collection
# Reruns the collection generator when its inputs change: the script itself or the mirrored
# SDK source it reads the request and query keys from. The commit this workflow pushes only
# touches the generated JSON, which is outside the paths filter, so it cannot retrigger itself.
on:
  push:
    branches:
    - latest
    paths:
    - postman/gen-collection.js
    - sdk/csharp/GatewayRequests.cs
    - sdk/csharp/GatewayQueries.cs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: regen-postman
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6 # https://github.com/actions/checkout
    - name: Regenerate the collection
      run: node postman/gen-collection.js
    - name: Commit the collection when it changed
      run: |
        if ! git diff --quiet postman/tss-play-gateway.postman_collection.json; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate the Postman collection" postman/tss-play-gateway.postman_collection.json
          git push
        fi
