syntax = "proto3";

option csharp_namespace = "TSS.Gateway.Sdk.Events";

// Payload messages for the events the player publishes on tss-events-publish (consumed from
// tss-events-listen). The routing key names the topic and action, for example story.started;
// the payload identifies the subject and carries the new value where there is one.
//
// Every uuid/integrationId pair identifies the story, scene, or asset the event is about.
// Positions and sizes are in pixels on the screen's canvas, origin at the bottom-left, y up.
// Volumes and progress are normalized: 0 to 1.

// story.started and story.stopped: identifies the story.
message StoryEvent {
    string uuid = 1;
    string integrationId = 2;
}

// scene.changed: identifies the scene that became active.
message SceneEvent {
    string uuid = 1;
    string integrationId = 2;
}

// Events that only identify the asset: asset.shown, asset.hidden, asset.playing, asset.paused,
// asset.muted, asset.unmuted, and asset.content-changed.
message AssetEvent {
    string uuid = 1;
    string integrationId = 2;
}

// story.master-volume-changed: uuid/integrationId identify the story.
message MasterVolumeChangedEvent {
    string uuid = 1;
    string integrationId = 2;
    float volume = 3;
}

// asset.moved: x/y is the new bottom-left corner of the asset.
message AssetMovedEvent {
    string uuid = 1;
    string integrationId = 2;
    float x = 3;
    float y = 4;
}

// asset.resized: the new size and bottom-left corner of the asset.
message AssetResizedEvent {
    string uuid = 1;
    string integrationId = 2;
    float width = 3;
    float height = 4;
    float left = 5;
    float bottom = 6;
}

// asset.page-changed.
message AssetPageChangedEvent {
    string uuid = 1;
    string integrationId = 2;
    int32 page = 3; // The new zero-based page index.
}

// asset.seek-ended.
message AssetProgressChangedEvent {
    string uuid = 1;
    string integrationId = 2;
    float normalizedProgress = 3; // The position the seek landed on.
}

// asset.cropped: the now-applied crop margins, in pixels from the asset's original edges.
message AssetCroppedEvent {
    string uuid = 1;
    string integrationId = 2;
    int32 left = 3;
    int32 top = 4;
    int32 right = 5;
    int32 bottom = 6;
}

// Currently unpublished; asset.resized and asset.moved report the outcome of an animation.
message AssetAnimatedRectEvent {
    string uuid = 1;
    string integrationId = 2;
    optional float x = 3;
    optional float y = 4;
    optional float width = 5;
    optional float height = 6;
}

// Currently unpublished; asset.volume-changed carries AssetVolumeChangeRequest (requests.proto).
message AssetVolumeChangedEvent {
    string uuid = 1;
    string integrationId = 2;
    float normalizedVolume = 3;
}

// instance.heartbeat: identifies this player instance, published every second by default.
message InstanceHeartbeatEvent {
    string app = 1; // The publishing application, "play" for the player.
    string locationUuid = 2;
    string setupUuid = 3;
    string setupName = 4;
    int32 screenId = 5;
    string screenName = 6;
    reserved 7, 8;
    reserved "ip", "apiPort";
    int64 sentAt = 9; // Publish time as Unix milliseconds (UTC).
}

enum Topic {
    STORY = 0;
    SCENE = 1;
    ASSET = 2;
    INSTANCE = 3;
}

enum StoryAction {
    STARTED = 0;
    STOPPED = 1;
    MASTER_VOLUME_CHANGED = 2;
}

enum SceneAction {
    CHANGED = 0;
}

enum InstanceAction {
    HEARTBEAT = 0;
}

enum AssetAction {
    SHOWN = 0;
    HIDDEN = 1;
    RESIZED = 2;
    MUTED = 3;
    UNMUTED = 4;
    PLAYING = 5;
    PAUSED = 6;
    PAGE_CHANGED = 7;
    CONTENT_CHANGED = 8;
    MOVED = 9;
    SEEK_ENDED = 10;
    CROPPED = 11;
    VOLUME_CHANGED = 12;
}
